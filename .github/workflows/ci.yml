name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: xcrun swift --version
      - name: Test
        run: xcrun swift test
      - name: Package
        run: bash scripts/package-app.sh "$RUNNER_TEMP/package"
      - name: Verify bundle
        run: codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/package/Codex Konten.app"
